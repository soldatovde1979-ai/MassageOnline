<!DOCTYPE html>
<html lang="ru">
<head><base target="_top"><meta charset="utf-8"><?!= include('styles') ?>
<!-- admin.html — VERSION = "1.2" (этап 15.4: кнопка «Клиенты», стили карточки клиента) -->
<style>
  .sheet{position:fixed;inset:0;background:rgba(20,16,12,.38);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet .panel{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.12);animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .acts .btn{flex:1 1 auto;text-align:center;text-decoration:none}
  .lbl{display:block;font-size:12px;color:var(--mut,#8a857b);margin-bottom:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;cursor:pointer;user-select:none}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  .sugwrap{position:relative}
  .sug{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .sug>div{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .sug>div:last-child{border-bottom:0}
  .picked{margin-top:8px;padding:8px 12px;background:var(--accent-bg);border-radius:10px;font-size:14px}
  .note{margin-top:8px;padding:8px 10px;background:#f6f4ef;border-radius:8px;font-size:14px}
  .gline{cursor:pointer}
  .gline:hover{background:rgba(156,74,42,.06)}
  .ev.st-completed{opacity:.55}
  .ev.st-no_show{opacity:.55;text-decoration:line-through}
  .fab{font-weight:600}
  .stats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .stats span{padding:4px 10px;border-radius:999px;background:var(--accent-bg);font-size:13px}
  .hist{margin-top:8px;border-top:1px solid var(--line)}
  .hist>div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .hist .st{color:var(--mut,#8a857b);white-space:nowrap}
  .clist>div{padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  textarea#cNotes{width:100%;min-height:96px;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;resize:vertical}
</style>
</head>
<body>
<div class="wrap wide">

  <div id="login">
    <h1>Вход мастера</h1>
    <p class="sub">Введите PIN</p>
    <input type="password" id="pin" inputmode="numeric" placeholder="••••••" style="max-width:220px;text-align:center;font-size:22px;letter-spacing:6px">
    <div class="msg err hide" id="loginMsg"></div>
    <button class="btn" id="doLogin" style="max-width:220px;margin-top:12px">Войти</button>
  </div>

  <div id="app" class="hide">
    <div class="between" style="margin-bottom:12px">
      <div>
        <h1 id="title"></h1>
        <div class="tiny" id="sync"></div>
      </div>
      <div class="tabs">
        <div class="tab sel" id="tabDay">День</div>
        <div class="tab" id="tabWeek">Неделя</div>
      </div>
    </div>

    <div class="row" style="margin-bottom:12px">
      <button class="btn ghost sm" id="prev">&#8249;</button>
      <button class="btn ghost sm" id="today">Сегодня</button>
      <button class="btn ghost sm" id="next">&#8250;</button>
      <div class="grow"></div>
      <button class="btn sm fab" id="newBk">+ Запись</button>
      <button class="btn ghost sm" id="openClients">Клиенты</button>
      <button class="btn ghost sm" id="openSched">График</button>
      <button class="btn ghost sm" id="logout">Выйти</button>
    </div>

    <div class="msg err hide" id="msg"></div>
    <div id="board"></div>

    <div id="schedBox" class="hide card" style="margin-top:12px">
      <h2 style="margin-top:0">Рабочий график</h2>
      <table class="sched"><tbody id="schedBody"></tbody></table>
      <div class="row" style="margin-top:12px">
        <button class="btn sm" id="saveSched">Сохранить</button>
        <button class="btn ghost sm" id="closeSched">Отмена</button>
      </div>
      <p class="tiny" style="margin-top:10px">Время должно быть кратно 30 минутам. Второе окно в дне добавляется строкой прямо в листе schedule.</p>
    </div>

    <div class="card" style="margin-top:16px">
      <h2 style="margin-top:0">Занят / личное время</h2>
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <button class="btn ghost sm" id="bLunch">Обед 1 ч</button>
        <button class="btn ghost sm" id="bRest">До конца дня</button>
        <button class="btn ghost sm" id="bAll">Весь день</button>
      </div>
      <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px">
        <input type="time" step="1800" id="cFrom" value="13:00" style="width:110px">
        <input type="time" step="1800" id="cTo" value="15:00" style="width:110px">
        <input type="text" id="cReason" placeholder="Причина (необязательно)" style="flex:1;min-width:160px">
        <button class="btn sm" id="bCustom">Заблокировать</button>
      </div>
      <div class="check" style="margin-bottom:0">
        <input type="checkbox" id="push" checked>
        <span>Публиковать блокировку в Google Календарь</span>
      </div>
    </div>
  </div>

</div>
<div id="sheet" class="sheet hide"><div class="panel" id="sheetBody"></div></div>

</body>
</html>
