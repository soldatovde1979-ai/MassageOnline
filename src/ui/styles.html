<style>
  :root{
    --ink:#1c1b19; --ink-2:#5f5e5a; --ink-3:#8a8880;
    --line:#e3e0d8; --bg:#faf9f6; --card:#ffffff;
    --accent:#9c4a2a; --accent-bg:#fbeee8;
    --busy:#8a8880; --ext:#4a7fb5; --ext-bg:#e8f0f8;
    --ok:#2f7a4f; --warn:#b06b12; --err:#b03a2e;
    --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px}
  .wrap.wide{max-width:1040px}
  h1{font-size:20px;font-weight:600;margin:0 0 4px}
  h2{font-size:15px;font-weight:600;margin:24px 0 10px}
  .sub{color:var(--ink-2);font-size:14px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .row{display:flex;gap:8px;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .grow{flex:1}
  .muted{color:var(--ink-2);font-size:13px}
  .tiny{font-size:12px;color:var(--ink-3)}
  .hide{display:none !important}

  .opt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;
    align-items:center;gap:10px;min-height:56px}
  .opt.sel{border-color:var(--accent);border-width:2px;background:var(--accent-bg)}
  .opt .t{font-weight:600;font-size:15px}

  .dates{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .dates::-webkit-scrollbar{display:none}
  .day{flex:0 0 56px;text-align:center;padding:8px 4px;border:1px solid var(--line);
    border-radius:var(--r);background:var(--card);cursor:pointer}
  .day .w{font-size:11px;color:var(--ink-2);text-transform:lowercase}
  .day .n{font-size:17px;font-weight:600}
  .day.sel{background:var(--ink);border-color:var(--ink);color:#fff}
  .day.sel .w{color:#ddd}
  .day.off{opacity:.35;cursor:default}

  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
  .slot{border:1px solid var(--line);background:var(--card);border-radius:var(--r);
    padding:11px 6px;text-align:center;font-size:13px;cursor:pointer;min-height:44px}
  .slot.sel{border-color:var(--accent);border-width:2px;background:var(--accent-bg);
    color:var(--accent);font-weight:600}

  label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 4px}
  input[type=text],input[type=tel],input[type=email],input[type=password],
  input[type=time],input[type=date],textarea,select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);
    font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
  textarea{min-height:64px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}

  .check{display:flex;gap:10px;align-items:flex-start;margin:14px 0}
  .check input{margin-top:3px;width:18px;height:18px;flex:0 0 auto}
  .check span{font-size:13px;color:var(--ink-2)}

  .btn{display:block;width:100%;padding:14px;border:0;border-radius:var(--r);
    background:var(--ink);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
  .btn.danger{background:transparent;color:var(--err);border:1px solid var(--err);font-weight:500}
  .btn.sm{width:auto;padding:8px 14px;font-size:14px}

  .msg{padding:11px 13px;border-radius:var(--r);font-size:14px;margin:12px 0}
  .msg.err{background:#fbeceb;color:var(--err)}
  .msg.ok{background:#e9f4ee;color:var(--ok)}
  .msg.warn{background:#fdf2e2;color:var(--warn)}

  .gantt{display:grid;grid-template-columns:52px 1fr;border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden;background:var(--card)}
  .gcol{position:relative;border-left:1px solid var(--line)}
  .gtime div{height:36px;font-size:11px;color:var(--ink-3);padding:2px 6px;
    border-bottom:1px solid var(--line);box-sizing:border-box}
  .gwrap{position:relative}
  .gline{height:36px;border-bottom:1px solid var(--line);box-sizing:border-box}
  .gline.off{background:repeating-linear-gradient(45deg,#f5f3ee,#f5f3ee 4px,transparent 4px,transparent 8px)}
  .ev{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 8px;
    font-size:12px;overflow:hidden;cursor:pointer;border-left:3px solid}
  .ev .t{font-weight:600;font-size:12px}
  .ev.booking{background:var(--accent-bg);border-color:var(--accent);color:#6d2f18}
  .ev.block{background:#f1efe9;border-color:var(--busy);color:#4a4944}
  .ev.external{background:var(--ext-bg);border-color:var(--ext);color:#1f4a75}
  .week{display:grid;gap:6px}
  .wd{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:10px 12px}
  .wd h3{margin:0 0 6px;font-size:14px;font-weight:600}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--ink-2)}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
  .tabs{display:flex;gap:6px}
  .tab{padding:7px 14px;border:1px solid var(--line);border-radius:var(--r);
    background:var(--card);font-size:14px;cursor:pointer}
  .tab.sel{background:var(--ink);border-color:var(--ink);color:#fff}
  table.sched{width:100%;border-collapse:collapse;font-size:14px}
  table.sched td{padding:6px 4px;border-bottom:1px solid var(--line)}
  table.sched input[type=time]{padding:6px 8px;font-size:14px}
  .spin{color:var(--ink-3);font-size:14px;padding:20px 0;text-align:center}
  a{color:var(--accent)}
  @media(min-width:760px){ .slots{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))} }
  .pick{background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--r);
    padding:10px 13px;margin-top:10px;font-size:14px;color:var(--ink)}
  .pick .warnt{color:var(--err)}
  .slot{user-select:none}
</style>
